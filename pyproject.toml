[project]
name = "n400fp"
version = "0.1.0"
description = "Feature processing for single-trial N400 semantic decoding on ERP CORE"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "mne>=1.7",
    "autoreject>=0.4.3",
    "python-picard>=0.7",
]

[project.optional-dependencies]
# torch is not listed: its build differs between machines (CPU, CUDA, Alliance wheels).
# Install torch first, then `pip install -e .[eegnet]`.
eegnet = ["braindecode>=0.8", "skorch>=0.15"]
download = ["hu-neuro-pipeline"]
dev = ["pytest>=8", "statsmodels>=0.14", "ruff>=0.5", "black>=24"]

[project.scripts]
n400fp = "n400fp.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests on synthetic recordings (ICA, autoreject); run with -m slow",
    "eegnet: needs torch and braindecode",
]
addopts = "-m 'not slow and not eegnet'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff.lint.flake8-bugbear]
# frozen dataclasses: safe as argument defaults
extend-immutable-calls = [
    "n400fp.config.PreprocConfig",
    "n400fp.config.FeatureConfig",
    "n400fp.config.DecodeConfig",
    "n400fp.config.PermutationConfig",
    "n400fp.config.EEGNetConfig",
]
